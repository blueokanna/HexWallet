name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'README_CN.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ESP32_CORE_VERSION: 3.3.10
  # arduino-cli release assets are versioned (arduino-cli_<ver>_<os>_<arch>.zip).
  # The bare "latest" alias (arduino-cli_latest_*.zip) no longer exists in the
  # release assets, so downloading it 404s. Pin a concrete tag instead.
  ARDUINO_CLI_VERSION: 1.5.1
  ARDUINO_CLI_BASE: https://github.com/arduino/arduino-cli/releases/download/v1.5.1

jobs:
  host-tests:
    name: Host self-tests (MSVC + ESP32 mbedtls headers)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: HexWallet
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: HexWallet

      - name: Install arduino-cli ${{ env.ARDUINO_CLI_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = "arduino-cli_${{ env.ARDUINO_CLI_VERSION }}_Windows_64bit.zip"
          $url   = "${{ env.ARDUINO_CLI_BASE }}/$asset"
          $zip   = Join-Path $env:RUNNER_TEMP $asset
          $dst   = Join-Path $env:RUNNER_TEMP 'arduino-cli'
          $bin   = Join-Path $env:RUNNER_TEMP 'bin'
          $deadline = (Get-Date).AddMinutes(3)
          $downloaded = $false
          do {
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
              $downloaded = $true
            } catch {
              Write-Warning "download failed: $($_.Exception.Message); retrying"
              Start-Sleep -Seconds 5
            }
          } while (-not $downloaded -and (Get-Date) -lt $deadline)
          if (-not $downloaded) { throw "failed to download $url" }
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Move-Item -Force (Join-Path $dst 'arduino-cli.exe') (Join-Path $bin 'arduino-cli.exe')
          & (Join-Path $bin 'arduino-cli.exe') version

      - name: Install ESP32 core ${{ env.ESP32_CORE_VERSION }} (exact mbedtls headers)
        shell: pwsh
        run: |
          $cli = "$env:RUNNER_TEMP\bin\arduino-cli.exe"
          & $cli config init --overwrite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli core update-index
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli core install esp32:esp32@${{ env.ESP32_CORE_VERSION }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate esp32-libs mbedtls include dir
        shell: pwsh
        run: |
          $libs = Join-Path $env:LOCALAPPDATA "Arduino15\packages\esp32\tools\esp32-libs\${{ env.ESP32_CORE_VERSION }}\include\mbedtls"
          if (-not (Test-Path $libs)) { throw "esp32-libs not found at $libs" }
          Add-Content -Path $env:GITHUB_ENV -Value "HEXWALLET_ESP32_LIBS=$libs"
          Write-Output "mbedtls include root: $libs"

      - name: Build and run host self-tests
        shell: pwsh
        run: |
          # build.ps1 compiles mbedtls_host.c + all firmware sources with cl.exe
          # and runs host_test.exe, exiting with the test verdict.
          powershell -ExecutionPolicy Bypass -File tests/host/build.ps1

      - name: Build real BIP32 and secp256k1 chain probe
        shell: pwsh
        run: |
          git clone --depth 1 --branch mbedtls-3.6.5 --recurse-submodules --shallow-submodules https://github.com/Mbed-TLS/mbedtls.git build/chain-mbedtls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File tests/host/build_chain_native.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/generate_chain_selftest.py --check

      - name: Catalog and phone protocol tests (require freshly built harness)
        shell: pwsh
        run: |
          # build.ps1 also links tests/host/link_pipe.exe, which runs the real
          # WalletLinkDevice/WalletNfcApdu code behind a line protocol. The
          # reference phone client drives pairing, handshake, encrypted
          # requests, replay and tamper rejection against it.
          if (-not (Test-Path tests/host/link_pipe.exe)) { throw "phone harness missing" }
          python -m unittest discover -s tests -p "test_*.py"

      - name: Verify native transfers and QRL addresses with independent SDKs
        shell: pwsh
        run: |
          npm install --prefix build/nem-sdk --ignore-scripts --save-exact nem-sdk@1.6.11 @hiveio/dhive@1.3.6 ethers@6.15.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --prefix build/flow-sdk --ignore-scripts --save-exact @scure/bip32@1.7.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --prefix build/icp-sdk --ignore-scripts --save-exact @icp-sdk/core@6.1.1 @icp-sdk/canisters@4.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build/sia-sdk, build/qrl-reference | Out-Null
          npm pack @siafoundation/sdk@0.5.0 --ignore-scripts --pack-destination build/sia-sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xf build/sia-sdk/siafoundation-sdk-0.5.0.tgz -C build/sia-sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm pack qrllib@1.3.2 --ignore-scripts --pack-destination build/qrl-reference
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xf build/qrl-reference/qrllib-1.3.2.tgz -C build/qrl-reference
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/reference/generate_native_remaining.cjs --check --verify-device
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/reference/generate_icp_vectors.cjs --check --verify-device
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/reference/generate_flow_lsk.cjs --check --verify-device
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/reference/generate_qrl_vectors.cjs --check --verify-device
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Python for independent SPL VM execution
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute firmware-signed SPL transactions in independent LiteSVM
        shell: pwsh
        run: |
          # Desktop-only oracle. Firmware has no VM dependency or network client.
          python -m pip install solders==0.28.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/reference/verify_spl_execution.py

      - name: Regenerate Stellar envelopes with independent SDK
        shell: pwsh
        run: |
          python -m pip install stellar-sdk==13.1.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/reference/generate_stellar_vectors.py --check

      - name: Regenerate Algorand transactions with independent SDK
        shell: pwsh
        run: |
          python -m pip install py-algorand-sdk==2.11.1 pynacl==1.6.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/reference/generate_algorand_vectors.py --check

      - name: Verify embedded known-answer vectors
        shell: pwsh
        run: |
          python tools/generate_algorand_selftest.py --check
          python tools/generate_near_selftest.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/generate_tezos_selftest.py --check

      - name: Regenerate XTZ operations with independent Taquito SDK
        shell: pwsh
        run: |
          npm install --prefix build/tezos-sdk --ignore-scripts --save-exact @taquito/local-forging@25.0.0 @taquito/signer@25.0.0 @taquito/utils@25.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/reference/generate_tezos_vectors.cjs --check

      - name: Save SPL execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: spl-litesvm-evidence
          path: HexWallet/build/spl-svm-execution.json
          if-no-files-found: error

      - name: Device-target compile check (xtensa g++)
        shell: pwsh
        run: |
          # Compiles every pure-C++ firmware source with the ESP32 Xtensa
          # toolchain to prove the crypto core builds for the 32-bit device.
          powershell -ExecutionPolicy Bypass -File tests/host/device_compile_check.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File tests/host/device_compile_check.ps1 -Target esp32p4

      - name: P4 worker and signing orchestration compile check
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tests/host/p4_runtime_compile_check.ps1

      - name: Clone LVGL 9.5.0 (for the board port compile check)
        shell: pwsh
        run: |
          # The board port check compiles against the REAL LVGL checkout so
          # driver code can never drift from the actual 9.5 API (the removed
          # lv_disp_drv_t/lv_indev_drv_t API once broke the build silently).
          git clone --depth 1 --branch v9.5.0 https://github.com/lvgl/lvgl.git tests/host/lvgl_real

      - name: Board port compile check (all board profiles)
        shell: pwsh
        run: |
          # Compiles WalletBoardPort.cpp + WalletUi.cpp for every supported
          # board profile (AMOLED, AMOLED Plus, T-Display S3, T-Deck Max,
          # T-Echo Lite) against the Xtensa toolchain and the real LVGL 9.5
          # headers, catching driver syntax/type errors before flashing.
          powershell -ExecutionPolicy Bypass -File tests/host/board_port_compile_check.ps1

      - name: Compile actual GxEPD2 panel path with real Arduino and LVGL
        shell: pwsh
        run: |
          git init build/epd-deps/GxEPD2
          git -C build/epd-deps/GxEPD2 remote add origin https://github.com/ZinggJM/GxEPD2.git
          git -C build/epd-deps/GxEPD2 fetch --depth 1 origin de82887e77a78528ea386e68bba2cb0291d2c319
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C build/epd-deps/GxEPD2 checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -ExecutionPolicy Bypass -File tests/host/epd_driver_compile_check.ps1

  firmware-build:
    name: Device build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: HexWallet
    strategy:
      fail-fast: false
      matrix:
        target: [esp32s3, esp32p4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: HexWallet

      - name: Install arduino-cli ${{ env.ARDUINO_CLI_VERSION }}
        run: |
          set -euo pipefail
          # The arduino-cli install.sh refuses to create $BINDIR itself; on a
          # fresh runner ~/bin does not exist, so create it first.
          mkdir -p "$HOME/bin"
          export BINDIR="$HOME/bin"
          curl -fsSL --retry 5 --retry-all-errors https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s "$ARDUINO_CLI_VERSION"
          "$HOME/bin/arduino-cli" version

      - name: Install ESP32 core ${{ env.ESP32_CORE_VERSION }}
        run: |
          export PATH="$HOME/bin:$PATH"
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ env.ESP32_CORE_VERSION }}

      - name: Install LVGL 9 (required by the sketch)
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          cd "$HOME/Arduino/libraries"
          # The sketch uses the LVGL 9 API (lv_screen_active, LV_OS_NONE, ...).
          git clone --depth 1 --branch v9.5.0 https://github.com/lvgl/lvgl.git

      - name: Compile firmware (S3 display / P4 headless)
        run: |
          export PATH="$HOME/bin:$PATH"
          # LV_CONF_INCLUDE_SIMPLE makes lvgl pick up lv_conf.h from the
          # sketch root (which arduino-cli puts on the include path); without
          # it LVGL falls back to its built-in defaults and the UI widgets
          # (list, textarea, keyboard, ...) are not compiled in.
          arduino-cli compile --fqbn esp32:esp32:${{ matrix.target }} --library "$HOME/Arduino/libraries/lvgl" \
            --build-property compiler.cpp.extra_flags=-DLV_CONF_INCLUDE_SIMPLE \
            --build-property compiler.c.extra_flags=-DLV_CONF_INCLUDE_SIMPLE \
            .
